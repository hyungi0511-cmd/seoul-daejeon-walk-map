function rescale(next,anchorX=W()/2,anchorY=H()/2){let zn=Math.max(MINZ,Math.min(MAXZ,Math.round(next)));if(zn===z)return;let wx=cx+anchorX-W()/2,wy=cy+anchorY-H()/2,ratio=2**(zn-z);cx=wx*ratio-anchorX+W()/2;cy=wy*ratio-anchorY+H()/2;z=zn;render();}
function fitPoints(points){if(!points.length)return;let ps=points.map(p=>project(p[0],p[1],0));let xs=ps.map(p=>p[0]),ys=ps.map(p=>p[1]),l=Math.min(...xs),r=Math.max(...xs),t=Math.min(...ys),b=Math.max(...ys);let padX=65,padY=140;let zz=Math.floor(Math.log2(Math.min(Math.max(80,W()-padX)/Math.max(.0001,r-l),Math.max(80,H()-padY)/Math.max(.0001,b-t))));z=Math.max(MINZ,Math.min(MAXZ,zz));cx=(l+r)/2*2**z;cy=(t+b)/2*2**z;render();}
function fitAll(){focusOne=null;document.querySelectorAll('.dayCard').forEach(e=>e.classList.remove('active'));let ps=[];DAYS.forEach(d=>d.segments.forEach(s=>s.forEach(p=>ps.push(p))));document.getElementById('mapLabel').classList.remove('show');fitPoints(ps);}
function selectDay(i){focusOne=i;document.querySelectorAll('.dayCard').forEach((e,j)=>e.classList.toggle('active',i===j));const d=DAYS[i];const label=document.getElementById('mapLabel');label.innerHTML=`<div class="t"><span class="dot" style="background:${d.color}"></span>${d.date} · ${i+1}일차 <span class="km">${d.km.toFixed(2)}km</span></div><div class="d">${d.from} → ${d.to}</div>`;label.classList.add('show');fitPoints(d.segments.flat());}
function render(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;paint()})}
function paint(){let width=W(),height=H(),dpr=Math.min(2,window.devicePixelRatio||1);C.width=Math.round(width*dpr);C.height=Math.round(height*dpr);C.style.width=width+'px';C.style.height=height+'px';CTX.setTransform(dpr,0,0,dpr,0,0);CTX.clearRect(0,0,width,height);
 const ox=width/2-cx,oy=height/2-cy;
 const x0=Math.floor((cx-width/2)/TILE)-1,x1=Math.floor((cx+width/2)/TILE)+1,y0=Math.floor((cy-height/2)/TILE)-1,y1=Math.floor((cy+height/2)/TILE)+1,max=2**z,active=new Set();
 for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){if(yy<0||yy>=max)continue;const tx=((xx%max)+max)%max,key=z+':'+tx+':'+yy;active.add(key);let el=tileNodes.get(key);if(!el){el=document.createElement('img');el.decoding='async';el.alt='';el.src=`https://tile.openstreetmap.org/${z}/${tx}/${yy}.png`;TILES.appendChild(el);tileNodes.set(key,el)}el.style.left=(xx*TILE+ox)+'px';el.style.top=(yy*TILE+oy)+'px';}
 for(const [key,el] of tileNodes){if(!active.has(key)){el.remove();tileNodes.delete(key)}}
 function drawLine(seg,color,weight){CTX.beginPath();for(let j=0;j<seg.length;j++){let p=seg[j],xy=project(p[0],p[1],z),X=xy[0]+ox,Y=xy[1]+oy;j?CTX.lineTo(X,Y):CTX.moveTo(X,Y)}CTX.strokeStyle=color;CTX.lineWidth=weight;CTX.lineCap='round';CTX.lineJoin='round';CTX.stroke();}
 DAYS.forEach((d,i)=>{for(let s of d.segments){if(s.length<2)continue;drawLine(s,'rgba(255,255,255,.9)',focusOne===i?8:6);drawLine(s,focusOne===null||focusOne===i?d.color:'rgba(112,131,145,.35)',focusOne===i?5:3.4);}});
 function marker(p,color,txt,rad=10){const q=project(p[0],p[1],z),x=q[0]+ox,y=q[1]+oy;CTX.beginPath();CTX.arc(x,y,rad+2,0,Math.PI*2);CTX.fillStyle='#fff';CTX.fill();CTX.strokeStyle=color;CTX.lineWidth=1.5;CTX.stroke();CTX.beginPath();CTX.arc(x,y,rad,0,Math.PI*2);CTX.fillStyle=color;CTX.fill();CTX.fillStyle='#fff';CTX.textAlign='center';CTX.textBaseline='middle';CTX.font='bold 11px system-ui';CTX.fillText(txt,x,y+1);CTX.textAlign='left';}
 if(focusOne===null){DAYS.forEach((d,i)=>marker(d.end,d.color,String(i+1),9));marker(DAYS[0].start,'#14866a','S',9);}else{let d=DAYS[focusOne];marker(d.start,d.color,'S',11);marker(d.end,d.color,'E',11);}
}
function drag(dx,dy){cx-=dx;cy-=dy;render()}
MAP.addEventListener('pointerdown',e=>{MAP.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});MAP.classList.add('dragging')});
MAP.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){pinch=null;drag(e.clientX-old.x,e.clientY-old.y);return;}let ps=[...pointers.values()],mid={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2},dist=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);if(!pinch){pinch={dist,mid};return;}drag(mid.x-pinch.mid.x,mid.y-pinch.mid.y);if(dist>pinch.dist*1.35){rescale(z+1,mid.x,mid.y);pinch={dist,mid}}else if(dist<pinch.dist/1.35){rescale(z-1,mid.x,mid.y);pinch={dist,mid}}else pinch.mid=mid;});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(pointers.size===0)MAP.classList.remove('dragging')}
MAP.addEventListener('pointerup',endPointer);MAP.addEventListener('pointercancel',endPointer);MAP.addEventListener('wheel',e=>{e.preventDefault();rescale(z+(e.deltaY<0?1:-1),e.clientX,e.clientY)},{passive:false});MAP.addEventListener('dblclick',e=>rescale(z+1,e.clientX,e.clientY));
document.getElementById('plus').onclick=()=>rescale(z+1);document.getElementById('minus').onclick=()=>rescale(z-1);document.getElementById('fit').onclick=fitAll;document.getElementById('allBtn').onclick=fitAll;
const list=document.getElementById('list');DAYS.forEach((d,i)=>{let btn=document.createElement('button');btn.type='button';btn.className='dayCard';btn.style.setProperty('--color',d.color);btn.innerHTML=`<div class="dayTop"><span class="dayNum">${i+1}일</span><span class="dayDate">11월 ${15+i}일</span><span class="dayDist">${d.km.toFixed(2)} km</span></div><div class="dayRoute"><span>${d.from}</span><span class="arrow">→</span><span>${d.to}</span></div>`;btn.onclick=()=>selectDay(i);list.append(btn)});
window.addEventListener('resize',()=>{focusOne===null?fitAll():selectDay(focusOne)});fitAll();
</script></body></html>
